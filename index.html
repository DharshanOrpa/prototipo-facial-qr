
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Prototipo Facial QR - Cámara</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #253247;
    }

    .contenedor {
      max-width: 460px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h2 {
      color: #174b85;
      margin-bottom: 8px;
    }

    .subtitulo {
      font-size: 14px;
      color: #687789;
      margin-bottom: 20px;
    }

    video, img {
      width: 100%;
      border-radius: 12px;
      background: #e7edf4;
      margin-top: 14px;
    }

    video {
      transform: scaleX(-1);
    }

    img {
      display: none;
    }

    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #1766ad;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .verde {
      background: #15915c;
    }

    .estado {
      margin-top: 18px;
      padding: 14px;
      background: #edf4fc;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h2>Reconocimiento Facial QR</h2>

    <p class="subtitulo">
      Prototipo V2.1.8 - Prueba de cámara frontal
    </p>

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <button onclick="abrirCamara()">
      1. Abrir cámara frontal
    </button>

    <button
      id="btnCapturar"
      class="verde"
      onclick="capturarFoto()"
      disabled>
      2. Capturar fotografía
    </button>

    <img id="foto" alt="Fotografía capturada">

    <div id="estado" class="estado">
      Presiona "Abrir cámara frontal".
    </div>

  </div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    let streamCamara = null;

    function mostrarEstado(mensaje) {
      document.getElementById("estado").textContent =
        mensaje;
    }

    async function abrirCamara() {
      try {
        detenerCamara();

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            "El navegador no admite acceso directo a la cámara."
          );
        }

        mostrarEstado(
          "Solicitando permiso para utilizar la cámara..."
        );

        streamCamara =
          await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: "user" },
              width: { ideal: 640 },
              height: { ideal: 480 }
            }
          });

        const video =
          document.getElementById("video");

        video.srcObject = streamCamara;
        await video.play();

        document.getElementById(
          "btnCapturar"
        ).disabled = false;

        mostrarEstado(
          "Cámara frontal activada correctamente."
        );

      } catch (error) {
        detenerCamara();

        mostrarEstado(
          "No se pudo abrir la cámara.\n" +
          "Error: " + error.name +
          "\nDetalle: " + error.message
        );
      }
    }

    function capturarFoto() {
      const video =
        document.getElementById("video");

      if (!streamCamara ||
          !video.videoWidth ||
          !video.videoHeight) {
        mostrarEstado("La cámara no está lista.");
        return;
      }

      const canvas =
        document.getElementById("canvas");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const contexto = canvas.getContext("2d");

      contexto.save();
      contexto.translate(canvas.width, 0);
      contexto.scale(-1, 1);
      contexto.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );
      contexto.restore();

      const foto =
        document.getElementById("foto");

      foto.src = canvas.toDataURL("image/jpeg", 0.9);
      foto.style.display = "block";

      mostrarEstado(
        "Fotografía capturada correctamente.\n" +
        "La imagen permanece en este navegador."
      );
    }

    function detenerCamara() {
      if (streamCamara) {
        streamCamara.getTracks().forEach(
          pista => pista.stop()
        );
      }

      streamCamara = null;

      document.getElementById(
        "btnCapturar"
      ).disabled = true;

      const video =
        document.getElementById("video");

      video.pause();
      video.srcObject = null;
    }

    window.addEventListener(
      "pagehide",
      detenerCamara
    );
  </script>

</body>
</html>

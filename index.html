
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Reconocimiento Facial QR V2.1.9</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #253247;
    }

    .contenedor {
      max-width: 480px;
      margin: 15px auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      color: #174b85;
      margin-bottom: 8px;
    }

    .subtitulo {
      font-size: 14px;
      color: #687789;
      margin-bottom: 18px;
    }

    video {
      width: 100%;
      max-height: 400px;
      object-fit: contain;
      background: #17212e;
      border-radius: 12px;
      transform: scaleX(-1);
    }

    .fotografias {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .tarjeta {
      border: 1px solid #dce4ed;
      border-radius: 12px;
      padding: 10px;
    }

    .tarjeta h3 {
      font-size: 13px;
      margin: 5px 0 10px;
    }

    .tarjeta img {
      display: none;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: contain;
      background: #edf1f5;
      border-radius: 8px;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #1766ad;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .verde {
      background: #15915c;
    }

    .estado {
      margin-top: 18px;
      padding: 14px;
      background: #edf4fc;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-line;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .nota {
      margin-top: 18px;
      color: #687789;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
  </script>
</head>

<body>

<div class="contenedor">

  <h2>Reconocimiento Facial QR</h2>

  <p class="subtitulo">
    Prototipo V2.1.9 - Cámara + IA
  </p>

  <video
    id="video"
    autoplay
    muted
    playsinline>
  </video>

  <button id="btnCamara" onclick="abrirCamara()">
    1. Abrir cámara frontal
  </button>

  <button
    id="btnReferencia"
    onclick="capturar(1)"
    disabled>
    2. Capturar rostro de referencia
  </button>

  <button
    id="btnComparacion"
    onclick="capturar(2)"
    disabled>
    3. Capturar rostro de comparación
  </button>

  <div class="fotografias">

    <div class="tarjeta">
      <h3>Foto 1: Referencia</h3>
      <img id="imagen1" alt="Rostro de referencia">
    </div>

    <div class="tarjeta">
      <h3>Foto 2: Comparación</h3>
      <img id="imagen2" alt="Rostro de comparación">
    </div>

  </div>

  <button
    id="btnModelos"
    onclick="cargarModelos()">
    4. Cargar modelos de IA
  </button>

  <button
    id="btnComparar"
    class="verde"
    onclick="compararRostros()"
    disabled>
    5. Comparar rostros
  </button>

  <div id="estado" class="estado">
    Abre la cámara frontal para comenzar.
  </div>

  <p class="nota">
    Prototipo experimental. No guarda fotografías
    ni descriptores biométricos en servidores.
    Todavía no incorpora detección de presencia real.
  </p>

</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
  const RUTA_MODELOS =
    "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights";

  let streamCamara = null;
  let modelosListos = false;
  let foto1Lista = false;
  let foto2Lista = false;
  let procesando = false;

  function mostrarEstado(mensaje) {
    document.getElementById("estado").textContent =
      mensaje;
  }

  function actualizarBotones() {
    const camaraLista = !!streamCamara;

    document.getElementById("btnReferencia").disabled =
      !camaraLista;

    document.getElementById("btnComparacion").disabled =
      !camaraLista;

    document.getElementById("btnComparar").disabled =
      !modelosListos ||
      !foto1Lista ||
      !foto2Lista ||
      procesando;
  }

  async function abrirCamara() {
    try {
      detenerCamara();

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error(
          "El navegador no admite acceso directo a la cámara."
        );
      }

      mostrarEstado(
        "Solicitando acceso a la cámara frontal..."
      );

      streamCamara =
        await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: "user" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          }
        });

      const video =
        document.getElementById("video");

      video.srcObject = streamCamara;
      await video.play();

      mostrarEstado(
        "Cámara frontal activada correctamente."
      );

    } catch (error) {
      detenerCamara();

      mostrarEstado(
        "Error al abrir la cámara:\n" +
        error.name + ": " + error.message
      );
    }

    actualizarBotones();
  }

  function capturar(numero) {
    const video =
      document.getElementById("video");

    if (!streamCamara ||
        !video.videoWidth ||
        !video.videoHeight) {
      mostrarEstado(
        "La cámara todavía no está lista."
      );
      return;
    }

    const canvas =
      document.getElementById("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const contexto = canvas.getContext("2d");

    contexto.save();
    contexto.translate(canvas.width, 0);
    contexto.scale(-1, 1);

    contexto.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    contexto.restore();

    const imagen =
      document.getElementById("imagen" + numero);

    if (numero === 1) {
      foto1Lista = false;
    } else {
      foto2Lista = false;
    }

    actualizarBotones();

    imagen.onload = function() {
      imagen.style.display = "block";

      if (numero === 1) {
        foto1Lista = true;
      } else {
        foto2Lista = true;
      }

      actualizarBotones();

      mostrarEstado(
        "Fotografía " + numero +
        " capturada correctamente."
      );
    };

    imagen.onerror = function() {
      mostrarEstado(
        "No se pudo procesar la fotografía " +
        numero + "."
      );
    };

    imagen.src =
      canvas.toDataURL("image/jpeg", 0.9);
  }

  async function cargarModelos() {
    const boton =
      document.getElementById("btnModelos");

    boton.disabled = true;

    mostrarEstado(
      "Cargando modelos de inteligencia artificial..."
    );

    try {
      if (typeof faceapi === "undefined") {
        throw new Error(
          "No se pudo cargar la biblioteca face-api.js."
        );
      }

      await faceapi.nets.tinyFaceDetector
        .loadFromUri(RUTA_MODELOS);

      await faceapi.nets.faceLandmark68Net
        .loadFromUri(RUTA_MODELOS);

      await faceapi.nets.faceRecognitionNet
        .loadFromUri(RUTA_MODELOS);

      modelosListos = true;

      mostrarEstado(
        "Los tres modelos faciales se cargaron correctamente."
      );

    } catch (error) {
      modelosListos = false;
      boton.disabled = false;

      mostrarEstado(
        "Error al cargar modelos:\n" +
        error.message
      );
    }

    actualizarBotones();
  }

  async function obtenerDescriptor(imagen) {
    const opciones =
      new faceapi.TinyFaceDetectorOptions({
        inputSize: 416,
        scoreThreshold: 0.2
      });

    const detecciones =
      await faceapi
        .detectAllFaces(imagen, opciones)
        .withFaceLandmarks()
        .withFaceDescriptors();

    if (detecciones.length === 0) {
      throw new Error(
        "No se detectó ningún rostro."
      );
    }

    if (detecciones.length > 1) {
      throw new Error(
        "Se detectaron varios rostros."
      );
    }

    return detecciones[0].descriptor;
  }

  async function compararRostros() {
    procesando = true;
    actualizarBotones();

    try {
      mostrarEstado(
        "Analizando ambos rostros..."
      );

      const descriptor1 =
        await obtenerDescriptor(
          document.getElementById("imagen1")
        );

      const descriptor2 =
        await obtenerDescriptor(
          document.getElementById("imagen2")
        );

      const distancia =
        faceapi.euclideanDistance(
          descriptor1,
          descriptor2
        );

      mostrarEstado(
        "COMPARACIÓN COMPLETADA\n\n" +
        "Foto 1: Rostro detectado\n" +
        "Foto 2: Rostro detectado\n\n" +
        "Distancia facial: " +
        distancia.toFixed(4) +
        "\n\nMenor distancia significa mayor similitud.\n" +
        "Todavía no existe un umbral de aprobación."
      );

    } catch (error) {
      mostrarEstado(
        "No se pudo completar la comparación:\n" +
        error.message
      );

    } finally {
      procesando = false;
      actualizarBotones();
    }
  }

  function detenerCamara() {
    if (streamCamara) {
      streamCamara.getTracks().forEach(
        pista => pista.stop()
      );
    }

    streamCamara = null;

    const video =
      document.getElementById("video");

    video.pause();
    video.srcObject = null;

    actualizarBotones();
  }

  window.addEventListener(
    "pagehide",
    detenerCamara
  );

  actualizarBotones();
</script>

</body>
</html>
